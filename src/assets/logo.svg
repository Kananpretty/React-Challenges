<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 64" fill="none">
  <defs>
    <!-- Dark Tile Background for the Icon only -->
    <linearGradient id="iconTileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>

    <!-- Electric Emerald to Neon Mint Gradient -->
    <linearGradient id="neonMint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Cyber Violet Gradient -->
    <linearGradient id="cyberViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
  </defs>

  <!-- ================= ICON ================= -->
  <g transform="translate(6, 6)">
    <!-- Icon Container -->
    <rect width="52" height="52" rx="14" fill="url(#iconTileBg)"/>
    <rect width="52" height="52" rx="14" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.2"/>

    <!-- Cube Frame -->
    <path d="M26 11L41 19.5V36.5L26 45L11 36.5V19.5L26 11Z" 
          stroke="url(#neonMint)" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M26 28L41 19.5M26 28L11 19.5M26 28V45" 
          stroke="url(#neonMint)" stroke-width="1.3" opacity="0.35"/>

    <!-- Lightning Spark -->
    <path d="M28 18L22 28H29L24 38" 
          stroke="url(#cyberViolet)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ================= TOP LINE: REACT CHALLENGE ================= -->
  <!-- "REACT" (Bold Clean White, high legibility) -->
  <text x="74" y="34" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="22" 
        font-weight="900" 
        letter-spacing="0.04em" 
        fill="#FFFFFF">
    REACT
  </text>

  <!-- "CHALLENGE" (Neon Mint) -->
  <text x="160" y="34" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="22" 
        font-weight="700" 
        letter-spacing="0.02em" 
        fill="#34D399">
    CHALLENGE
  </text>

  <!-- ================= BOTTOM RIGHT: PLAYGROUND ================= -->
  <!-- Aligned under "CHALLENGE" (x="160") -->
  <text x="160" y="52" 
        font-family="'SF Mono', 'Fira Code', Menlo, Consolas, Monaco, monospace" 
        font-size="11" 
        font-weight="700" 
        letter-spacing="0.22em" 
        fill="#C084FC">
    PLAYGROUND
  </text>
</svg>
